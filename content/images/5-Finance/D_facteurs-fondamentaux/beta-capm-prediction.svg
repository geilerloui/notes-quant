<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="400" height="300" fill="#f7f5f0"/>

  <!-- Axes -->
  <line x1="60" y1="250" x2="360" y2="250" stroke="#444" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="30" stroke="#444" stroke-width="1.5"/>

  <!-- Arrow heads -->
  <polygon points="360,246 370,250 360,254" fill="#444"/>
  <polygon points="56,30 60,20 64,30" fill="#444"/>

  <!-- Axis labels -->
  <text x="375" y="254" font-size="13" fill="#444" font-style="italic">β</text>
  <text x="20" y="26" font-size="11" fill="#444" text-anchor="middle">R (%)</text>

  <!-- X ticks -->
  <line x1="110" y1="250" x2="110" y2="255" stroke="#444" stroke-width="1"/>
  <text x="110" y="268" font-size="10" fill="#666" text-anchor="middle">0.6</text>
  <line x1="185" y1="250" x2="185" y2="255" stroke="#444" stroke-width="1"/>
  <text x="185" y="268" font-size="10" fill="#666" text-anchor="middle">1.0</text>
  <line x1="260" y1="250" x2="260" y2="255" stroke="#444" stroke-width="1"/>
  <text x="260" y="268" font-size="10" fill="#666" text-anchor="middle">1.4</text>
  <line x1="335" y1="250" x2="335" y2="255" stroke="#444" stroke-width="1"/>
  <text x="335" y="268" font-size="10" fill="#666" text-anchor="middle">1.8</text>

  <!-- Y ticks -->
  <line x1="55" y1="200" x2="60" y2="200" stroke="#444" stroke-width="1"/>
  <text x="50" y="204" font-size="10" fill="#666" text-anchor="end">0.5</text>
  <line x1="55" y1="150" x2="60" y2="150" stroke="#444" stroke-width="1"/>
  <text x="50" y="154" font-size="10" fill="#666" text-anchor="end">1.0</text>
  <line x1="55" y1="100" x2="60" y2="100" stroke="#444" stroke-width="1"/>
  <text x="50" y="104" font-size="10" fill="#666" text-anchor="end">1.5</text>

  <!-- Grid lines -->
  <line x1="60" y1="200" x2="360" y2="200" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="150" x2="360" y2="150" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>
  <line x1="60" y1="100" x2="360" y2="100" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,4"/>

  <!-- CAPM line: upward slope -->
  <line x1="80" y1="220" x2="350" y2="68" stroke="#c0392b" stroke-width="2"/>

  <!-- Data points on the line (deciles by beta) -->
  <circle cx="110" cy="208" r="5" fill="#185FA5"/>
  <circle cx="135" cy="192" r="5" fill="#185FA5"/>
  <circle cx="155" cy="180" r="5" fill="#185FA5"/>
  <circle cx="175" cy="168" r="5" fill="#185FA5"/>
  <circle cx="195" cy="156" r="5" fill="#185FA5"/>
  <circle cx="215" cy="144" r="5" fill="#185FA5"/>
  <circle cx="235" cy="132" r="5" fill="#185FA5"/>
  <circle cx="258" cy="117" r="5" fill="#185FA5"/>
  <circle cx="283" cy="100" r="5" fill="#185FA5"/>
  <circle cx="320" cy="78" r="5" fill="#185FA5"/>

  <!-- Title -->
  <text x="200" y="18" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">Ce que le CAPM prédit</text>
  <text x="200" y="285" font-size="10" fill="#888" text-anchor="middle">Chaque point = un décile trié par bêta</text>
</svg>
