<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="680" height="300" fill="#f7f5f0"/>

  <!-- Column headers -->
  <text x="282" y="18" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Small (50% bas — médiane ME)</text>
  <text x="522" y="18" font-size="13" fill="#333" text-anchor="middle" font-weight="bold">Big (50% haut)</text>

  <!-- Row labels -->
  <text x="88" y="82" font-size="12" fill="#666" text-anchor="middle">Value</text>
  <text x="88" y="96" font-size="11" fill="#888" text-anchor="middle">(70ᵉ pct +)</text>
  <text x="88" y="162" font-size="12" fill="#666" text-anchor="middle">Neutral</text>
  <text x="88" y="176" font-size="11" fill="#888" text-anchor="middle">(30–70ᵉ)</text>
  <text x="88" y="242" font-size="12" fill="#666" text-anchor="middle">Growth</text>
  <text x="88" y="256" font-size="11" fill="#888" text-anchor="middle">(30ᵉ pct -)</text>

  <!-- Grid borders -->
  <line x1="120" y1="28" x2="120" y2="285" stroke="#888" stroke-width="0.8"/>
  <line x1="120" y1="28" x2="640" y2="28" stroke="#888" stroke-width="0.8"/>
  <line x1="120" y1="285" x2="640" y2="285" stroke="#888" stroke-width="0.8"/>
  <line x1="640" y1="28" x2="640" y2="285" stroke="#888" stroke-width="0.8"/>
  <line x1="120" y1="122" x2="640" y2="122" stroke="#bbb" stroke-width="0.8"/>
  <line x1="120" y1="204" x2="640" y2="204" stroke="#bbb" stroke-width="0.8"/>
  <line x1="382" y1="28" x2="382" y2="285" stroke="#888" stroke-width="1.2"/>

  <!-- Small Value -->
  <rect x="128" y="36" width="246" height="78" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="251" y="68" font-size="13" fill="#633806" text-anchor="middle" font-weight="bold">Small Value (SV)</text>
  <text x="251" y="88" font-size="11" fill="#854F0B" text-anchor="middle">Petite cap · B/M élevé</text>

  <!-- Big Value -->
  <rect x="390" y="36" width="242" height="78" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="511" y="68" font-size="13" fill="#633806" text-anchor="middle" font-weight="bold">Big Value (BV)</text>
  <text x="511" y="88" font-size="11" fill="#854F0B" text-anchor="middle">Grande cap · B/M élevé</text>

  <!-- Small Neutral -->
  <rect x="128" y="130" width="246" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="251" y="158" font-size="13" fill="#444441" text-anchor="middle" font-weight="bold">Small Neutral (SN)</text>
  <text x="251" y="178" font-size="11" fill="#5F5E5A" text-anchor="middle">Petite cap · B/M moyen</text>

  <!-- Big Neutral -->
  <rect x="390" y="130" width="242" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="511" y="158" font-size="13" fill="#444441" text-anchor="middle" font-weight="bold">Big Neutral (BN)</text>
  <text x="511" y="178" font-size="11" fill="#5F5E5A" text-anchor="middle">Grande cap · B/M moyen</text>

  <!-- Small Growth -->
  <rect x="128" y="212" width="246" height="65" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="251" y="240" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">Small Growth (SG)</text>
  <text x="251" y="260" font-size="11" fill="#185FA5" text-anchor="middle">Petite cap · B/M faible</text>

  <!-- Big Growth -->
  <rect x="390" y="212" width="242" height="65" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="511" y="240" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="bold">Big Growth (BG)</text>
  <text x="511" y="260" font-size="11" fill="#185FA5" text-anchor="middle">Grande cap · B/M faible</text>
</svg>
