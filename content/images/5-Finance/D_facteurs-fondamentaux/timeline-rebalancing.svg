<svg width="680" height="160" viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="680" height="160" fill="#f7f5f0"/>

  <!-- Timeline axis -->
  <line x1="40" y1="65" x2="640" y2="65" stroke="#444" stroke-width="1.5"/>
  <polygon points="638,61 648,65 638,69" fill="#444"/>

  <!-- NYSE start -->
  <rect x="40" y="48" width="70" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="75" y="70" font-size="11" fill="#444" text-anchor="middle">NYSE…</text>

  <!-- Arrow -->
  <line x1="112" y1="65" x2="148" y2="65" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Rebalance 1 -->
  <rect x="150" y="40" width="90" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="195" y="60" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="bold">Juillet</text>
  <text x="195" y="78" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="bold">rebalance</text>

  <!-- 12 months dashes -->
  <line x1="242" y1="65" x2="368" y2="65" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="305" y="54" font-size="10" fill="#888" text-anchor="middle">12 mois — compositions fixes</text>
  <text x="305" y="82" font-size="10" fill="#888" text-anchor="middle">rendements mensuels observés</text>

  <!-- Rebalance 2 -->
  <rect x="370" y="40" width="90" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="415" y="60" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="bold">Juillet</text>
  <text x="415" y="78" font-size="12" fill="#3C3489" text-anchor="middle" font-weight="bold">rebalance</text>

  <!-- 12 months dashes 2 -->
  <line x1="462" y1="65" x2="580" y2="65" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="521" y="54" font-size="10" fill="#888" text-anchor="middle">12 mois — compositions fixes</text>

  <!-- Dots -->
  <text x="618" y="70" font-size="18" fill="#888" text-anchor="middle">…</text>

  <!-- Bottom notes -->
  <text x="195" y="112" font-size="10" fill="#666" text-anchor="middle">Recalcul B/M et ME_t</text>
  <text x="195" y="126" font-size="10" fill="#666" text-anchor="middle">6 portefeuilles reformés</text>
  <text x="415" y="112" font-size="10" fill="#666" text-anchor="middle">Une action peut changer</text>
  <text x="415" y="126" font-size="10" fill="#666" text-anchor="middle">de catégorie d'une année à l'autre</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
